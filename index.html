<!DOCTYPE html>
<html lang="en">
    

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop Math Game</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

    <h1 class="title">🧠 Drag & Drop Game 🧠</h1>

    <div id="questionBox" class="question-box"></div>

    <div class="game-container">

        <div id="slotsContainer" class="slots-container"></div>

        <div>
            <h3>🎯 Drag the correct answers</h3>
            <div id="optionsContainer" class="options-container"></div>
        </div>

    </div>

    <button id="nextBtn" class="next-btn" disabled>
        Next Question →
    </button>

</div>

<script src="js/data.js"></script>
<script src="js/script.js"></script>

</body>
</html>

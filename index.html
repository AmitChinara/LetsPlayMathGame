<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Boss Battle - Single Screen Arena</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

    <h1 class="title">🧠 Math Boss Battle! 🧠</h1>

    <div class="battle-arena">
        <div id="player" class="character player">🧙‍♂️ <span id="playerName">Player</span></div>
        <div id="projectile" class="projectile">✨</div>
        <div id="fireball" class="fireball">🔥</div>
        <div id="boss" class="character boss">👹 Boss</div>
    </div>

    <div class="game-dashboard">
        
        <div class="left-panel">
            <div id="questionBox" class="question-box"></div>
            <button id="nextBtn" class="next-btn" disabled>
                🚀 Shoot!
            </button>
        </div>

        <div class="right-panel">
            <div class="game-container">
                <div id="slotsContainer" class="slots-container"></div>
                <div class="options-wrapper">
                    <h3>🎯 Drag the correct answers</h3>
                    <div id="optionsContainer" class="options-container"></div>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="js/data.js"></script>
<script src="js/script.js"></script>

</body>
</html>
